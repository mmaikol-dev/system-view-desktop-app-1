[package]
name = "pcmind"
version = "0.1.0"
description = "PCMind - lightweight desktop system monitor"
authors = ["you"]
edition = "2024"

[lib]
name = "pcmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
